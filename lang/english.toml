loc__ship_sailor_island  = "Oh, that island.. well, it's Evros, a city where first baedoorians coming here settled. Nowadays we treat it as the last port before New Baedoor, to resupply, sell good or just rest. 'Under Golden Rat' tavern has splendid wine!"
