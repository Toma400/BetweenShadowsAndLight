loc__docks_mage_a2ntrick = "If you ask those things, you apparently don't know how our world works. So. There are forces here, that we all need to oblige: magic and technology. Both exclude each other, so you can't be a mage using strong firearms. The more you walk towards one side, the more you close the other."
