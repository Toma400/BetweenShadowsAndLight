loc__ship_captain_answer = "I see.. yes."
loc__ship_captain_cheat1 = "So you say that you want to be dropped on that island we don't see...? Well, I can fulfill that wish..."
loc__ship_captain_cheat2 = "I was dropped on the nearby tiny island, which seems abandoned - it is so small that house found on its top feels to be the only thing that exists here aside of few trees.."
loc__ship_sailor_greet   = "Welcome, stranger. Do we know each other?"
loc__ship_sailor_greeta1 = "Eeem.. no, I don't think so"
loc__ship_sailor_greeta2 = "Oh yes, absolutely!"
loc__ship_sailor_kidding = "Haha, you won't fool old Sam. Maybe my eyes fail me nowadays more often, but I remember perfectly each face I talked to."
loc__ship_sailor_que1    = "Then what's the matter?"
loc__ship_sailor_que1a1  = "I don't have a cent to my name, could you help me?"
loc__ship_sailor_que1a2  = "To be honest I don't know myself what I'm doing here..."
loc__ship_sailor_que1a3  = "What is that island before us?"
loc__ship_sailor_que1a4  = "I have sweet roll for you!"
loc__ship_sailor_island  = "Oh, that island.. well, it's Evros, a city where first baedoorians coming here settled. Nowadays we treat it as the last port before New Baedoor, to resupply, sell good or just rest. 'Under Golden Rat' tavern has splendid wine!"
loc__ship_sailor_life    = "Well, I can't really help you, I'm myself in similar situation."
loc__ship_sailor_dunno   = "I don't know all the more so! You need to find it out by yourself, friend."
loc__ship_sailor_que2    = "On the other hand, I have a knife that doesn't serve me any purpose.. but I won't give it to you for free, of course. Do you want to buy it, or maybe do something for me?"
loc__ship_sailor_que2a1  = "I will buy it"
loc__ship_sailor_que2a2  = "I will do something for you"
loc__ship_sailor_que2a3  = "I'm not really interested..."
loc__ship_sailor_offer   = "Alright, give me seven funts."
loc__ship_sailor_bought  = "Thanks! I hope it will serve you well."
loc__ship_sailor_be_back = "Sure. I will be here if you change your mind."
loc__ship_sailor_quest   = "Alright. In that case, go to the cook - he is downstairs - and take sweet roll from him. I'm hungry being here.. but I need to be on watch, so that captain see I'm not shirking from work. Are you in?"
loc__ship_sailor_questa1 = "Sure!"
loc__ship_sailor_questa2 = "Eh, I think I will let it be.."
loc__ship_sailor_waiting = "Amazing. I'm waiting for you then!"
loc__ship_sailor_howlong = "You know that I will give you that knife. But bring me bun first."
loc__ship_sailor_thanks  = "You brought the bun! Thank you a lot. Here, have the promised knife."
loc__ship_kitchen        = "You go downstairs, to the room where cook works.. you see fishes arranged on shelves, and few rolls."
loc__ship_kitchen_steal  = "Try to steal the roll"
loc__ship_kitchen_ask    = "Ask cook for the roll"
loc__ship_kitchen_theft  = "I took the roll without cook noticing."
loc__ship_cook_kind      = "You say you need roll? Sure, sonny, here, enjoy it."
loc__ship_cook_angry     = "I saw you, you rascal! I would give you the roll if you asked, but you ain't getting it now."
loc__shipd_looked_around = "You see middle-sized port before you, full of people. 'Arennan' sailors go back and forth trying to resupply the ship."
loc__shipd_captain       = "Oh, hello. Good to see you in one piece. Those pirates were skilled jerks, for a while I wasn't sure if we could make it."
loc__shipd_captain2      = "As you see, we docked to Evros port. You can get off the ship and look around, it will take us a few days before we repair all damages and get all supplies needed."
loc__island              = "I'm staying on the pier, from which leads tiny path towards house.. but there's nothing really besides that."
loc__island_look_around  = "Look around the area"
loc__island_barrels      = "Look into barrels on the pier"
loc__island_roots        = "I found some weird roots, but nothing besides that."
loc__island_barrel_open  = "Opened the barrel."
loc__abhouse_enter       = "You come to the house, seeing that doors don't resist.. it is a little rusty and you can see noone was here for a while. But it looks quite cosy. I could make myself at home here."
loc__abhouse_enter2      = "The interior is small, but filled to the brim with things, as if whoever lived here haven't seen it barely fits them already. There's a bed in the corner, with tiny table nearby. Next to it there is a chest. There's only one window in the room, and a desk before it has book opened."
loc__abhouse_que1        = "Read the book"
loc__abhouse_que2        = "Open the chest"
loc__abhouse_que3        = "Sleep"
loc__abhouse_book        = "Welcome. If you read this, you must have ventured to my home, which became yours in this moment. Don't worry about it, I am not living here anymore. You can use this house however you want - keep your pieces in the chest, sleep, eat, cook or make tools. There is some money and weapon in the chest, they can be of help. Treat the home well!"
loc__abhouse_chest       = "I opened the chest!"
loc__abhouse_sleep       = "Right, I will sleep then.."
loc__docks               = "The coast is covered with stones. From the platform our ship has docked to drags a wide road towards city's interior. On the coast a tavern and some warehouses can be seen. Sailors and other people walk around."
loc__docks_que1          = "Enter the 'Under Golden Rat' tavern"
loc__docks_que2          = "Visit the shop with magical symbol on the signboard"
loc__docks_que3          = "Talk to sailor in blue-white clothes"
loc__docks_que4          = "Come closer to richly clothed boy"
loc__docks_que5          = "Try to enter the warehouse"
loc__docks_sailor_greet  = "Welcome, stranger."
loc__docks_sailor_que1   = "What interesting is here to see?"
loc__docks_sailor_que2   = "Farewell"
loc__docks_sailor_answer = "You know, we are in Evros.. there's nothing really worth seeing here, this island is painfully practical. There's a coast used by ships travelling by, a city with fairly typical look if you ever been to baedoorian settlement, finally there are fields. If you fancy visiting shops, maybe you will find them interesting - there's plenty of them. And if you like alcohol running through your veins, there's a tavern right before you."
loc__docks_le_velga      = "Welcome."
loc__docks_le_velga_que1 = "Who are you?"
loc__docks_le_velga_que2 = "Can I do something for you?"
loc__docks_le_velga_que3 = "Farewell"
loc__docks_le_velga_an1  = "Who am I? I don't think it's particularly needed to you.."
loc__docks_le_velga_an2  = "But if you insist. Dominic le Velga, from Velga family. I'm overseeing lading of good to my father's ship, nothing particularly interesting."
loc__docks_le_velga_no   = "Do for me? I appreciate the will, but I don't think I need anything from you."
loc__docks_atg_ini1      = "Warehouse is locked, and guarded by many soldiers.. maybe I shouldn't be roaming around here."
loc__docks_atg_ini2      = "Shhhh!"
loc__docks_atg_ini3      = "I noticed some man who tries to get my attention, subtly waving at me for me to get closer."
loc__docks_atg_ini4      = "Hey, do you want to earn some easy money? I could have.. a job for you. *blinks knowingly*"
loc__docks_atg_que1      = "Sure, eking out is my whole life! What's the deal?"
loc__docks_atg_que2      = "What do you mean?"
loc__docks_atg_que3      = "Get lost..."
loc__docks_atg_quea1     = "You know, this warehouse. I know what they have inside. My clients.. need something from there."
loc__docks_atg_quea2     = "In few hours the night will fall. If you wait for that, guards should be easier to avoid. I will give you few lockpicks and show you a cool trick. Bring me silk you will find in warehouse. That's all I need, and you can keep whatever else you find."
loc__docks_atg_queagr    = "Alright, this sounds like a deal!"
loc__docks_atg_quemor    = "Hell no, you haven't said this involves stealing!"
loc__docks_atg_querej    = "Nah, this ain't for me."
loc__docks_atg_agreed    = "I knew you will decide wisely. I will be here when you will have silk for me. See you!"
loc__docks_atg_rej       = "Alright, friend. Maybe we will meet one day again. Or maybe not."
loc__docks_atg_finished  = "Well, a warehouse. Nothing unique about it, except for maybe amount of guards protecting it."
loc__docks_atg_wait      = "It is too early yet!"
loc__docks_atg_burg1     = "Try to enter the warehouse"
loc__docks_atg_burg2     = "Report the situation to the guard"
loc__docks_atg_burgenter = "Nice, I avoided that guard. Now to only open that lock.."
loc__docks_atg_burgwin   = "It worked! I can get in now."
loc__docks_atg_burgche   = "And here is the famous chest.."
loc__docks_atg_burgfail1 = "Ooh, damn, a guard. Need to sneak more carefully."
loc__docks_atg_burgfail2 = "This lock is quite hard.."
loc__docks_atg_suc1      = "I knew I could count on you! Thank you for the silk.. though, I need to tell you something."
loc__docks_atg_suc2      = "I am guard spy!"
loc__docks_atg_suc3      = "Ha ha, no. Sorry for that awful joke. It's actually quite the opposite. I search for people who have flair for such things. We need to keep ourselves together. That's what the guild is for. You heard about it?"
loc__docks_atg_suc4      = "Our fame comes before us. Though it isn't the safest option, not with Empire trying to choke us on every corner. Either way, you did your job well."
loc__docks_atg_suc5      = "If you are interested in getting to the guild.. search for a guy called Hrevir. I won't tell you where he is, but once you figure out, he will introduce you to the rest of us."
loc__docks_atg_suc6      = "I'm Lannot, by the way. Just in case we meet again. I need to go now, but we will probably see ourselves again, friend."
loc__docks_atg_rep1      = "Thank you for your report, citizen! We will make sure that this rat gets found and punished."
loc__docks_atg_rep2      = "Here, take this reward for your public spirit. Fifty funts. It's all we can offer from our funds, but should let you last for few boozes in the tavern."
loc__docks_atg_reenter   = "I can get into warehouse again.. but I should be careful, guards feel somewhat more alerted."
loc__docks_tavern        = "You enter the tavern, filled with smell of beer and sweat. Groups of sailors sit at the tables, talking on various topics, sometimes playing cards or croaking at unfunny jokes of their friends."
loc__docks_tavern_que1   = "Buy something from the barman"
loc__docks_tavern_que2   = "Rent the bed in tavern"
loc__docks_tavern_que3   = "Go to the room"
loc__docks_tavern_que4   = "Go outside"
loc__docks_tavern_zzzzz  = "One night in tavern will cost you eight coins."
loc__docks_tavern_sleep1 = "I will buy it"
loc__docks_tavern_sleep2 = "I will resign"
loc__docks_tavern_slepok = "Thanks. Here is the key. The room is free for one night."
loc__docks_tavern_sleep  = "You feel rested."
loc__docks_tavern_noslep = "You don't have key to this room!"
loc__docks_mage          = "Welcome in 'Magical Brew' in Evros, a shop of cheapest prices, friend! What do you need?"
loc__docks_mage_que1     = "I want to buy something"
loc__docks_mage_que2     = "Can I help you with something?"
loc__docks_mage_que3     = "Ee... what quackery do you sell?"
loc__docks_mage_que4     = "Nothing really.."
loc__docks_mage_que5     = "I have parchment for you!"
loc__docks_mage_task     = "Hm.. there is something, actually. Yesterday I was so invested in testing new spells that now all my scrolls are gone - so soon I will be out of scrolls to sell! Maybe.. you could bring me parchment?"
loc__docks_mage_taskre1  = "Sure, why not!"
loc__docks_mage_taskre2  = "I would rather not.."
loc__docks_mage_taskacc  = "Thank you! You should get parchment in general goods store, deeper in the city.. tell the guy that you come from me, so he will put it on my account."
loc__docks_mage_taskpend = "Well, for now bring me that parchment."
loc__docks_mage_taskdone = "I'm sorry, but I don't need anything more from you."
loc__docks_mage_aintrick = "Those are not trickeries, friend. Magic exists, and I think you will find people who will prove it to you soon. But maybe it's better to start believing before someone burn your clothes with their staff?"
loc__docks_mage_a2ntrick = "If you ask those things, you apparently don't know how our world works. So. There are forces here, that we all need to oblige: magic and technology. Both exclude each other, so you can't be a mage using strong firearms. The more you walk towards one side, the more you close the other."
loc__docks_mage_a3ntrick = "Magic is an unique art - using it, you can go far. But to work upon it, you need a good staff: with it, you will be able to use magic in fight, but also create strong magic scrolls, all unavailable to the ones less knowledgeable of magic."
loc__docks_mage_aintask  = "If you want, I can teach you staffs and magic.. but first you need to do me a favour, hm?"
loc__docks_mage_aintask2 = "Thank you! I need a parchment. You should get parchment in general goods store, deeper in the city.. tell the guy that you come from me, so he will put it on my account."
loc__docks_mage_happy    = "Oh, thank you a lot! Finally I will be able to create scrolls to sell."
loc__docks_mage_happy2   = "You deserved a reward. Let me teach you basics of spellcasting."
loc__evros               = "The city looks better than could be expected - houses are well-maintained, and while not unduly rich, they seem to stay proudly against the ubiquitous sea around."
loc__evros_que1          = "Visit general goods shop"
loc__evros_que2          = "Visit herbalist shop"
loc__evros_que3          = "Visit the smith"
loc__evros_que4          = "Enter the bank"
loc__evros_que5          = "Buy newspaper from paperboy"
loc__evros_smith         = "Welcome in my workshop!"
loc__evros_smith_que1    = "What do you have for sale?"
loc__evros_smith_que2    = "Can I use the forge?"
loc__evros_smith_anvil   = "Sure, here it is."
loc__evros_newspaper     = "FRESH NEEEWS!! ONLY TWO FUNTS FOR NEWSPAPER!"
loc__evros_newspaper_buy = "Can I buy one?"
loc__evros_newspaper_bu2 = "Sure."
loc__evros_merchant      = "Hello! What do you need?"
loc__evros_merchant_que1 = "I wanna see what you have for trade"
loc__evros_merchant_que2 = "Do you have any bullets?"
loc__evros_merchant_que3 = "...nothing particular"
loc__evros_merchant_que4 = "I come from that mage on the coast, he asked me to bring him a parchment"
loc__evros_merchant_prch = "Oh right, I indeed am behind with its delivery to him. Here, take this parchment for him."
loc__evros_merchant_bull = "Yes. Can sell you ten bullets for ten funts."
loc__evros_merchant_bubu = "Here they are"
loc__evros_merchant_buno = "Ain't buying, sorry"
loc__evros_merchant_busu = "Sure! Here are the bullets."
loc__evros_herbalist     = "Welcome! What do you need, fella?"
loc__evros_herbalist_qu1 = "What do you have for sale?"
loc__evros_herbalist_qu2 = "Can I use the laboratory?"
loc__evros_herbalist_qu3 = "Nothing really"
loc__evros_herbalist_qu4 = "Do you need some herbs by chance?"
loc__evros_herbalist_qa4 = "Of course.. Hyerbitus flowers grow on fields right behind the city. If you get any, I will buy them from you ten funts each."
loc__evros_herbalist_hrb = "I have herbs!"
loc__evros_herbalist_h2b = "Oh, you have Hyerbitus, splendid! Here are your coins."
loc__evros_herbalist_wrk = "Sure, just don't make it explode."
loc__fields              = "Before you spread fields of Evros, full of wheat and herbs of all kinds.. from them though you can see vermins peeking from time to time, living undisturbed. Maybe there are too many of them.."
loc__fields_que1         = "Fight the vermins"
loc__fields_que2         = "Approach the house"
loc__fields_que3         = "Search for herbs"
loc__fields_que4         = "Use the campfire"
loc__fields_que5         = "Work on a field"
loc__fields_farmer       = "Coming closer to the house, you see an old lady with good-natured, covered with lines face. She looks at you with interest."
loc__fields_farmer2      = "The house is rusty, but you know that you can count on strong hand of farmer lady."
loc__fields_farmer_ask   = "Can I help with something?"
loc__fields_farmer_sure  = "Of course that you can, sweetie, there's always a need of help on the farm. Do you want to work? You will get pay for every wheat you bring to me, of course."
loc__fields_farmer_yes   = "I will!"
loc__fields_farmer_no    = "Hm.. maybe I won't.."
loc__fields_farmer_yesa1 = "Beautiful, sweetie. Then take this sickle and cut as much wheat you can."
loc__fields_farmer_yesa2 = "Wheat grows back ever and again, so you won't cut too much at once - go back from time to time and cut more. Then bring the wheat to me, you will get nine funts for each."
loc__fields_farmer_work1 = "I have wheat for you!"
loc__fields_farmer_work2 = "I would like to resign"
loc__fields_farmer_give  = "Oh, wonderfully, sweetie. Thank you for the wheat. Here are your deserved money."
loc__fields_farmer_rsgn  = "You want to leave? Alright, swwetie. Please, give me back the sickle, and I will find our deal as finished."
loc__fields_farmer_rsgn2 = "You want to leave? Sure, but without a sickle I gave you I can't accept that resignation. Bring it to me, sweetie, so that someone else can use it while helping me."
