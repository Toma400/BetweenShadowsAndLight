# Quests - MQ
quest__mq_intro1 = "I travel long time, sailing on 'Arennan' to the Baedoor's port... who knows, how many days I insufferably await that sight of the land. I only know that, once I get there, everything will change. Everything will be possible, unlike that shithole I am from. It was so miserable to rot in that small village, dreaming of the big, modern world. But now I am on the ship.. thank god the captain was so kind to take me for free."
quest__mq_intro2 = "Either way, I should take a look around that ship. Maybe someone will have something interesting to say."

