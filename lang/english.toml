# Tutorials - general
game__tut_1  = "Welcome in Between Shadows and Light! This tutorial will guide you through game's interface."
game__tut_2  = "First step in the game is creating a character - it is quite important aspect, but you don't need to stress if you don't know what focus to take. The game was made in a way that should let you end it smoothly no matter what choices you take."
game__tut_3  = "Every statistics, skill, attribute or class you pick will have influence on your gameplay - a lot of these differences you will be able to minimise during game, as the choices done on the beginning are as important as the following gameplay style and decisions."
game__tut_4  = "Repair system is based on two skills in Between Shadows: repair and smithing. Smithing is used for all the repairs that need those skills to be in place - repair on the other hand is needed for technological needs (including machines)."
game__tut_5  = "Remember that you can experiment, even when not knowing recipes - samely, you can fail at making stronger potions without enough skills."
game__tut_6  = "Putting ingredients, remember that you consume them all when attempting to make a mixture. The same will happen when you exit the laboratorium."
game__tut_7  = "Soon you will see fight panel - it should be rather intuitive. It's good to mention however that there are various attack techniques - depending on weapon held. Each has different traits, bringing you unique bonuses and disadvantages."
game__tut_8  = "If you haven't used equipment and didn't equip any weapon, do it during the fight using inventory option. Remember each time you use inventory, you won't deal damage to the enemy in that turn."
game__tut_9  = "Cooking and roasting is an art in itself, and proper ingredients in cook's hands can achieve a lot. In the game you can choose between cooking and roasting - depending on whether there's a pot provided near the campfire. Once you enter any of these modes, just select item or items to be used. Roasted food tends to heal you better, meanwhile cooked water lets you use herbs more effectively and without risk of poisoning yourself."
game__tut_10 = "Quite important: you can roast only one item at once."

# Tutorials - quests
quest__mq_tut1 = "So, your adventure begins! In a second you will get to the first place of events, and so you will see first game menu - which you will use to the very end."
quest__mq_tut2 = "First part of menu is a short summary of most important information: where you are, how much health points you have, and the weight of your inventory. It's nothing you can interact with, but it provides some useful context."
quest__mq_tut3 = "What matters more however is next part - the one that has options in square brackets. It looks like this:"
quest__mq_tut4 = "...it is that part that will let you navigate through game for most of the time - all the events appear as a result of your decisions done in this menu, typing respective command and confirming by pressing Enter."
quest__mq_tut5 = "The most important from those two are: inventory and location. It is through the former that you can manage your items (use them, checking their state), and through the latter you can check what the location you are in has to offer."
quest__mq_tut6 = "'Character' shows us detailed information about our character - but as you can't change anything through it, it only provides the context. "
quest__mq_tut7 = "We will bring map a bit later; diary, on the other hand, let you check quests that you accepted. It is also through diary that you can save or quit the game."
quest__mq_tut8 = "In this game you will also need the last element: map. You can open the map from the main game menu. Map allows you to travel between locations that are directly reachable from the area you are in."

