# Tutorials - general
game__tut_1 = "Witaj w grze Between Shadows and Light! Tutorial ten będzie Cię prowadził po meandrach interfejsu - jest on pisany dość bogato w zawartość, jednak mam nadzieję, że nie spowoduje to chaosu."
game__tut_2 = "Pierwszym elementem gry jest stworzenie postaci, stąd za chwilę do tego przejdziemy - jest to dość istotna kwestia, jednak nie musisz się stresować, gdy nie wiesz, co dokładnie zrobić: gra stara się być tak dostosowana, by gracz z dowolnymi statystykami mógł ją względnie miło ukończyć."
game__tut_3 = "Istotne wspomnieć jest, że każda statystyka, umiejętność, cecha czy klasa, którą wybierzesz, będzie miała niemały wpływ na dalszy przebieg rozgrywki - wiele tych różnic jednak będziesz mógł zatrzeć w miarę gry, gdyż pierwsze wybory są na równi znaczące, jak i dalej: styl gry i wybory w niej dokonywane."

# Tutorials - quests
quest__mq_tut1 = "Tak więc Twoja przygoda się rozpoczęła! Za chwilę trafisz w pierwsze miejsce wydarzeń, jak i również wyświetli Ci się główne menu gry - z którego to będziesz korzystać później do samego końca."
quest__mq_tut2 = "Pierwszy fragment menu to krótkie podsumowanie najważniejszych informacji: gdzie się znajdujesz, ile punktów zdrowia posiadasz, jak bardzo obciąża Cię ekwipunek. Ta część menu nie służy więc niczemu ponadto, ale bywa użyteczna w sprawdzaniu najistotniejszych rzeczy."
quest__mq_tut3 = "Bardziej interesuje nas jednak kolejna część menu - ta, w której wypisane są poszczególne opcje w kwadratowych nawiasach. Wygląda ona tak:"
quest__mq_tut4 = "...i ta część służy Ci do nawigacji w grze przez większość czasu - wszelkie inne zdarzenia wywoływane są w zależności od tego, co dokonasz za pomocą tego menu, wpisując odpowiednią komendę i potwierdzając Enterem."
quest__mq_tut5 = "Najważniejsze wśród tych opcji są: ekwipunek i lokacja. Dzięki temu pierwszemu możesz zarządzać swoimi rzeczami (używać przedmiotów, sprawdzać ich stan), a za pomocą drugiego - sprawdzać, co lokacja, w której jesteś, ma do zaoferowania."
quest__mq_tut6 = "'Postać' pokazuje nam szczegółowe informacje dotyczące naszej postaci - nie daje nam ona jednak żadnej możliwości zmiany czegokolwiek, będąc jedynie częścią informacyjną."
quest__mq_tut7 = "Mapą zajmiemy się później; z kolei dziennik pozwala Ci na sprawdzenie zadań, których zobowiązałeś/aś się podjąć; a ponadto możesz za jego pomocą zapisać lub wyłączyć grę."

