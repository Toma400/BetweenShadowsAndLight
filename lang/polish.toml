# Tutorials - general
game__tut_1  = "Witaj w grze Between Shadows and Light! Tutorial ten będzie Cię prowadził po meandrach interfejsu - jest on pisany dość bogato w zawartość, jednak mam nadzieję, że nie spowoduje to chaosu."
game__tut_2  = "Pierwszym elementem gry jest stworzenie postaci, stąd za chwilę do tego przejdziemy - jest to dość istotna kwestia, jednak nie musisz się stresować, gdy nie wiesz, co dokładnie zrobić: gra stara się być tak dostosowana, by gracz z dowolnymi statystykami mógł ją względnie miło ukończyć."
game__tut_3  = "Istotne wspomnieć jest, że każda statystyka, umiejętność, cecha czy klasa, którą wybierzesz, będzie miała niemały wpływ na dalszy przebieg rozgrywki - wiele tych różnic jednak będziesz mógł zatrzeć w miarę gry, gdyż pierwsze wybory są na równi znaczące, jak i dalej: styl gry i wybory w niej dokonywane."
game__tut_4  = "System naprawy jest w Between Shadows and Light oparty na dwóch umiejętnościach: naprawy, ale i kucia. Kucie reprezentuje te wszystkie naprawy, które wciąż wymagają umiejętności kowalstwa - z kolei naprawa potrzebna jest głównie do technologicznej części broni i pancerzy (jak i również do maszyn)."
game__tut_5  = "Pamiętaj, że możesz eksperymentować, nie znając przepisów - tak samo, jak znając przepis, może nie udać Ci się stworzyć mikstury, jeśli brak Ci umiejętności."
game__tut_6  = "Wkładając składniki do przetworzenia, pamiętaj, że po spróbowaniu zrobienia mikstury - jak i również przy wyjściu z laboratorium - wszystkie składniki zostają stracone. Rzecz jasna, gdy będziesz miał odpowiednie składniki, przetworzenie ich da Ci miksturę, której potrzebujesz."
game__tut_7  = "Za chwilę pojawi się panel walki - jest on raczej intuicyjny. Powinniśmy jednak napomknieć o tym, że są różne rodzaje ataku - zależne od aktualnie trzymanej broni. Każdy z nich ma inną charakterystykę, skupiającą się na innej taktyce walki."
game__tut_8  = "Jeżeli do tej pory nie korzystałeś z ekwipunku, i nie dobyłeś broni (poprzez 'włożenie jej na siebie'), uczyń to podczas walki wybierając opcję ekwipunku. Pamiętaj, że każde skorzystanie z ekwipunku zabiera Ci rundę."
game__tut_9  = "Gotowanie i pieczenie to nie lada sztuka, a odpowiednie składniki w rękach dobrego kucharza mogą zdziałać cuda. W grze możesz wybierać między gotowaniem a pieczeniem - zależnie, czy jesteś jedynie przy ognisku, czy może jest przy nim garnek. Z kolei gdy włączysz którąkolwiek z opcji, zasada jest podobna - kładąc odpowiednie składniki na 'szali', możesz je ugotować lub upiec, by służyły Ci lepiej. Z reguły rzeczy upieczone są smaczniejsze i lepiej leczą, z kolei zaś ugotowana woda daje Ci możliwości wykorzystania ziół, i nie zatrucia się przy okazji."
game__tut_10 = "Dość istotna uwaga: piec możesz jedną rzecz naraz."

# Tutorials - quests
quest__mq_tut1 = "Tak więc Twoja przygoda się rozpoczęła! Za chwilę trafisz w pierwsze miejsce wydarzeń, jak i również wyświetli Ci się główne menu gry - z którego to będziesz korzystać później do samego końca."
quest__mq_tut2 = "Pierwszy fragment menu to krótkie podsumowanie najważniejszych informacji: gdzie się znajdujesz, ile punktów zdrowia posiadasz, jak bardzo obciąża Cię ekwipunek. Ta część menu nie służy więc niczemu ponadto, ale bywa użyteczna w sprawdzaniu najistotniejszych rzeczy."
quest__mq_tut3 = "Bardziej interesuje nas jednak kolejna część menu - ta, w której wypisane są poszczególne opcje w kwadratowych nawiasach. Wygląda ona tak:"
quest__mq_tut4 = "...i ta część służy Ci do nawigacji w grze przez większość czasu - wszelkie inne zdarzenia wywoływane są w zależności od tego, co dokonasz za pomocą tego menu, wpisując odpowiednią komendę i potwierdzając Enterem."
quest__mq_tut5 = "Najważniejsze wśród tych opcji są: ekwipunek i lokacja. Dzięki temu pierwszemu możesz zarządzać swoimi rzeczami (używać przedmiotów, sprawdzać ich stan), a za pomocą drugiego - sprawdzać, co lokacja, w której jesteś, ma do zaoferowania."
quest__mq_tut6 = "'Postać' pokazuje nam szczegółowe informacje dotyczące naszej postaci - nie daje nam ona jednak żadnej możliwości zmiany czegokolwiek, będąc jedynie częścią informacyjną."
quest__mq_tut7 = "Mapą zajmiemy się później; z kolei dziennik pozwala Ci na sprawdzenie zadań, których zobowiązałeś/aś się podjąć; a ponadto możesz za jego pomocą zapisać lub wyłączyć grę."
quest__mq_tut8 = "W tej części gry będziesz potrzebować ostatniego elementu: mapy. System mapy możesz w każdej chwili uruchomić w głównej części gry, wpisując po prostu odpowiednie hasło: zasada jego działania jest bliźniaczo podobna do pozostałych części menu. Mapa pozwala Ci na przemieszczanie się między większymi i mniejszymi fragmentami lokacji - dzięki temu jesteś w stanie odkrywać kolejne miejsca, połączone z Twoim obecnym miejscem pobytu."

